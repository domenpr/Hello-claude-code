<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šahovska igra s konjem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .game-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-container {
            flex: 0 0 auto;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 3px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
            transition: background-color 0.3s;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.highlight {
            background-color: #9acd32 !important;
        }

        .square.last-move {
            background-color: #ffd700 !important;
        }

        .piece {
            cursor: default;
            user-select: none;
        }

        .controls {
            flex: 1;
            min-width: 250px;
        }

        .control-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .control-section h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 100px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-algorithm {
            background: #e9ecef;
            color: #333;
            border: 2px solid transparent;
        }

        .btn-algorithm.active {
            background: #667eea;
            color: white;
            border-color: #5568d3;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-display {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .game-over {
            background: #28a745;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }

        .game-over.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐴 Šahovska igra s konjem</h1>

        <div class="game-layout">
            <div class="board-container">
                <div id="chessboard" class="chessboard"></div>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Algoritmi</h3>
                    <div class="button-group">
                        <button class="btn-algorithm" id="algo-random" onclick="selectAlgorithm('random')">🎲 Naključni</button>
                    </div>
                    <div class="button-group">
                        <button class="btn-algorithm" id="algo-greedy" onclick="selectAlgorithm('greedy')">🎯 Greedy</button>
                    </div>
                    <div class="button-group">
                        <button class="btn-algorithm active" id="algo-smart" onclick="selectAlgorithm('smart')">🧠 Pameten</button>
                    </div>
                    <div class="button-group">
                        <button class="btn-algorithm" id="algo-perfect" onclick="selectAlgorithm('perfect')">🏆 Popolno</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Nadzor igre</h3>
                    <div class="button-group">
                        <button class="btn-success" onclick="startGame()">▶ Start</button>
                        <button class="btn-danger" onclick="stopGame()">⏸ Stop</button>
                    </div>
                    <div class="button-group">
                        <button class="btn-secondary" onclick="resetGame()">🔄 Reset</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Hitrost</h3>
                    <div class="speed-control">
                        <button class="btn-primary" onclick="decreaseSpeed()">🐌 Počasneje</button>
                        <div class="speed-display" id="speed-display">0.5s</div>
                        <button class="btn-primary" onclick="increaseSpeed()">⚡ Hitreje</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Statistika</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-label">Poteze</div>
                            <div class="stat-value" id="moves">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Pobrane</div>
                            <div class="stat-value" id="captured">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Preostale</div>
                            <div class="stat-value" id="remaining">31</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Možne poteze</div>
                            <div class="stat-value" id="possible">0</div>
                        </div>
                    </div>
                </div>

                <div class="game-over" id="game-over">
                    🎉 Igra končana! <br>
                    <span id="final-stats"></span>
                </div>

                <div class="game-over" id="computing-indicator" style="background: #667eea; display: none;">
                    🧠 Računam optimalno pot... <br>
                    <div style="font-size: 32px; font-weight: bold; margin-top: 10px;">
                        <span id="progress-percent">0</span>%
                    </div>
                    <small>Lahko traja nekaj sekund</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let board = Array(8).fill().map(() => Array(8).fill(null));
        let knightPos = { row: 7, col: 0 }; // a1 position (bottom-left)
        let gameRunning = false;
        let moveSpeed = 500; // milliseconds
        let currentAlgorithm = 'smart';
        let stats = {
            moves: 0,
            captured: 0,
            remaining: 30
        };
        let gameInterval = null;
        let lastMoveSquare = null;

        // Optimal path computation (for smart algorithm)
        let optimalPath = [];
        let currentPathIndex = 0;
        let isComputingPath = false;

        // Chess pieces (Unicode)
        const pieces = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Knight move offsets
        const knightMoves = [
            [-2, -1], [-2, 1], [-1, -2], [-1, 2],
            [1, -2], [1, 2], [2, -1], [2, 1]
        ];

        // Compute optimal path using backtracking with progress tracking
        function computeOptimalPath() {
            isComputingPath = true;
            optimalPath = [];
            currentPathIndex = 0;

            // Show computing indicator
            const indicator = document.getElementById('computing-indicator');
            const progressEl = document.getElementById('progress-percent');
            if (indicator) indicator.classList.add('show');
            if (progressEl) progressEl.textContent = '0';

            // Create a copy of the board for simulation
            const boardCopy = board.map(row => [...row]);
            const startPos = { ...knightPos };

            let bestPath = [];
            let bestScore = 0;
            let totalIterations = 0;
            let progressIterations = 0;
            const MAX_TIME = 30000; // 30 seconds max
            const startTime = Date.now();
            let lastProgressUpdate = Date.now();

            // Update progress display (smooth updates every 500ms)
            function updateProgress(force = false) {
                const now = Date.now();
                if (force || now - lastProgressUpdate > 500) {
                    if (progressEl) {
                        const elapsed = now - startTime;
                        const percent = Math.min(99, Math.floor((elapsed / MAX_TIME) * 100));
                        progressEl.textContent = percent;
                    }
                    lastProgressUpdate = now;
                }
            }

            // Backtracking function with Warnsdorff's pruning
            function backtrack(pos, path, tempBoard, captured) {
                totalIterations++;

                // Update progress periodically
                if (totalIterations % 1000 === 0) {
                    updateProgress();
                }

                // Time limit check
                if (Date.now() - startTime > MAX_TIME) {
                    return true; // Signal timeout
                }

                // Update best path if this is better
                if (captured > bestScore) {
                    bestScore = captured;
                    bestPath = [...path];
                    console.log(`🎯 New best: ${bestScore} captures (${totalIterations.toLocaleString()} iterations)`);
                    updateProgress(true);

                    // Perfect solution found!
                    if (captured === 31) {
                        console.log('🏆 PERFECT SOLUTION FOUND!');
                        return true; // Signal completion
                    }
                }

                // Get possible capture moves
                const validMoves = [];
                for (const [dr, dc] of knightMoves) {
                    const newRow = pos.row + dr;
                    const newCol = pos.col + dc;
                    if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
                        if (tempBoard[newRow][newCol] !== null) {
                            validMoves.push({ row: newRow, col: newCol });
                        }
                    }
                }

                // If no more captures possible, return
                if (validMoves.length === 0) {
                    return false;
                }

                // Sort moves by Warnsdorff's heuristic (fewest onward captures first)
                validMoves.sort((a, b) => {
                    const aCaptures = knightMoves.filter(([dr, dc]) => {
                        const r = a.row + dr, c = a.col + dc;
                        return r >= 0 && r < 8 && c >= 0 && c < 8 && tempBoard[r][c] !== null;
                    }).length;
                    const bCaptures = knightMoves.filter(([dr, dc]) => {
                        const r = b.row + dr, c = b.col + dc;
                        return r >= 0 && r < 8 && c >= 0 && c < 8 && tempBoard[r][c] !== null;
                    }).length;
                    return aCaptures - bCaptures; // Try moves with FEWER captures first (Warnsdorff's)
                });

                // Try each possible move
                for (const move of validMoves) {
                    // Save the piece at destination
                    const savedPiece = tempBoard[move.row][move.col];

                    // Make the move
                    tempBoard[move.row][move.col] = 'KNIGHT';
                    path.push(move);

                    // Recurse
                    const result = backtrack(move, path, tempBoard, captured + 1);

                    // Undo the move
                    tempBoard[move.row][move.col] = savedPiece;
                    path.pop();

                    // Early exit if timeout or perfect solution found
                    if (result === true) {
                        return true;
                    }
                }

                return false;
            }

            // Start backtracking from initial position (async to avoid UI freeze)
            setTimeout(() => {
                console.log('🚀 Starting backtracking optimization...');
                backtrack(startPos, [], boardCopy, 0);

                optimalPath = bestPath;
                isComputingPath = false;

                // Show 100% before hiding
                if (progressEl) progressEl.textContent = '100';

                setTimeout(() => {
                    if (indicator) indicator.classList.remove('show');
                }, 800);

                console.log(`✅ Optimization complete: ${bestPath.length} captures found in ${totalIterations.toLocaleString()} iterations`);
                console.log(`📊 Result: ${31 - bestPath.length} pieces remaining`);
            }, 50);
        }

        // Initialize board with classical chess setup (compressed to 4 rows at bottom)
        function initializeBoard() {
            // Clear board
            board = Array(8).fill().map(() => Array(8).fill(null));

            // Black pieces (rows 4-5, bottom area)
            const blackBackRow = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
            for (let col = 0; col < 8; col++) {
                board[4][col] = blackBackRow[col];
                board[5][col] = 'p';
            }

            // White pieces (rows 6-7, bottom area)
            for (let col = 0; col < 8; col++) {
                board[6][col] = 'P';
            }
            const whiteBackRow = ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'];
            for (let col = 0; col < 8; col++) {
                board[7][col] = whiteBackRow[col];
            }

            // Replace white knight at a1 (row 7, col 0) with active KNIGHT
            board[7][0] = 'KNIGHT';
            knightPos = { row: 7, col: 0 };

            // Reset stats
            stats = {
                moves: 0,
                captured: 0,
                remaining: 31 // 32 total pieces - 1 knight = 31
            };

            updateStats();
            renderBoard();

            // Compute optimal path for perfect algorithm (async to avoid blocking UI)
            if (currentAlgorithm === 'perfect') {
                setTimeout(() => {
                    computeOptimalPath();
                }, 100);
            }
        }

        // Render the chessboard
        function renderBoard() {
            const chessboard = document.getElementById('chessboard');
            chessboard.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.className += (row + col) % 2 === 0 ? ' light' : ' dark';
                    square.dataset.row = row;
                    square.dataset.col = col;

                    const piece = board[row][col];
                    if (piece) {
                        if (piece === 'KNIGHT') {
                            square.innerHTML = '<span class="piece">♞</span>';
                        } else {
                            square.innerHTML = `<span class="piece">${pieces[piece]}</span>`;
                        }
                    }

                    chessboard.appendChild(square);
                }
            }

            updatePossibleMoves();
        }

        // Get valid knight moves
        function getValidMoves(row, col) {
            const validMoves = [];

            for (const [dr, dc] of knightMoves) {
                const newRow = row + dr;
                const newCol = col + dc;

                if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
                    validMoves.push({ row: newRow, col: newCol });
                }
            }

            return validMoves;
        }

        // Update possible moves count (only capture moves)
        function updatePossibleMoves() {
            const validMoves = getValidMoves(knightPos.row, knightPos.col);
            const captureMoves = validMoves.filter(move =>
                board[move.row][move.col] !== null
            );
            document.getElementById('possible').textContent = captureMoves.length;
        }

        // Random algorithm (only capture moves)
        function selectMoveRandom() {
            const validMoves = getValidMoves(knightPos.row, knightPos.col);
            if (validMoves.length === 0) return null;

            // Only allow capture moves
            const captureMoves = validMoves.filter(move =>
                board[move.row][move.col] !== null
            );

            if (captureMoves.length === 0) return null;
            return captureMoves[Math.floor(Math.random() * captureMoves.length)];
        }

        // Greedy algorithm (only capture moves)
        function selectMoveGreedy() {
            const validMoves = getValidMoves(knightPos.row, knightPos.col);
            if (validMoves.length === 0) return null;

            // Only allow capture moves
            const captureMoves = validMoves.filter(move =>
                board[move.row][move.col] !== null
            );

            if (captureMoves.length === 0) return null;
            return captureMoves[Math.floor(Math.random() * captureMoves.length)];
        }

        // Smart algorithm (Warnsdorff's heuristic - instant, no waiting)
        function selectMoveSmart() {
            const validMoves = getValidMoves(knightPos.row, knightPos.col);
            if (validMoves.length === 0) return null;

            // Only allow capture moves
            const captureMoves = validMoves.filter(move =>
                board[move.row][move.col] !== null
            );

            if (captureMoves.length === 0) return null;

            // Warnsdorff's heuristic: choose capture with FEWEST onward captures
            // This prevents getting stuck in corners early
            let bestMove = captureMoves[0];
            let minOnwardCaptures = Infinity;

            for (const move of captureMoves) {
                // Count onward capture possibilities
                const onwardMoves = getValidMoves(move.row, move.col);
                const onwardCaptures = onwardMoves.filter(m =>
                    board[m.row][m.col] !== null && !(m.row === knightPos.row && m.col === knightPos.col)
                ).length;

                if (onwardCaptures < minOnwardCaptures) {
                    minOnwardCaptures = onwardCaptures;
                    bestMove = move;
                }
            }

            return bestMove;
        }

        // Perfect algorithm (uses precomputed optimal path via backtracking)
        function selectMovePerfect() {
            // If path is being computed, wait
            if (isComputingPath) {
                return null;
            }

            // If we have a precomputed path, follow it
            if (optimalPath.length > 0 && currentPathIndex < optimalPath.length) {
                const nextMove = optimalPath[currentPathIndex];
                currentPathIndex++;
                return nextMove;
            }

            // Fallback: if no path available, use smart heuristic
            return selectMoveSmart();
        }

        // Select move based on current algorithm
        function selectMove() {
            switch (currentAlgorithm) {
                case 'random':
                    return selectMoveRandom();
                case 'greedy':
                    return selectMoveGreedy();
                case 'smart':
                    return selectMoveSmart();
                case 'perfect':
                    return selectMovePerfect();
                default:
                    return selectMoveSmart();
            }
        }

        // Move knight
        function moveKnight(newPos) {
            // Check if capturing a piece (must always be true with new rules)
            const captured = board[newPos.row][newPos.col] !== null;

            // Move knight
            board[knightPos.row][knightPos.col] = null;
            board[newPos.row][newPos.col] = 'KNIGHT';
            knightPos = newPos;

            // Update stats
            stats.moves++;
            if (captured) {
                stats.captured++;
                stats.remaining--;
            }

            updateStats();
            renderBoard();
            highlightLastMove(newPos);

            // Check if game over (no more capture moves available)
            const validMoves = getValidMoves(knightPos.row, knightPos.col);
            const captureMoves = validMoves.filter(move =>
                board[move.row][move.col] !== null
            );

            if (captureMoves.length === 0 || stats.remaining === 0) {
                endGame();
            }
        }

        // Highlight last move
        function highlightLastMove(pos) {
            // Remove previous highlight
            const squares = document.querySelectorAll('.square');
            squares.forEach(sq => sq.classList.remove('last-move'));

            // Add new highlight
            const square = document.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
            if (square) {
                square.classList.add('last-move');
            }
        }

        // Update statistics display
        function updateStats() {
            document.getElementById('moves').textContent = stats.moves;
            document.getElementById('captured').textContent = stats.captured;
            document.getElementById('remaining').textContent = stats.remaining;
        }

        // Game loop
        function gameLoop() {
            const nextMove = selectMove();
            if (nextMove) {
                moveKnight(nextMove);
            } else {
                endGame();
            }
        }

        // Start game
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gameInterval = setInterval(gameLoop, moveSpeed);
            document.getElementById('game-over').classList.remove('show');
        }

        // Stop game
        function stopGame() {
            gameRunning = false;
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }

        // Reset game
        function resetGame() {
            stopGame();
            document.getElementById('game-over').classList.remove('show');
            initializeBoard();
        }

        // End game
        function endGame() {
            stopGame();
            const gameOverDiv = document.getElementById('game-over');
            const finalStats = document.getElementById('final-stats');
            finalStats.textContent = `Poteze: ${stats.moves} | Pobrane: ${stats.captured}/${31} | Preostale: ${stats.remaining}`;
            gameOverDiv.classList.add('show');
        }

        // Select algorithm
        function selectAlgorithm(algo) {
            currentAlgorithm = algo;

            // Update button styles
            document.querySelectorAll('.btn-algorithm').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`algo-${algo}`).classList.add('active');

            // If perfect algorithm is selected and path not computed, compute it
            if (algo === 'perfect' && optimalPath.length === 0 && !isComputingPath) {
                setTimeout(() => {
                    computeOptimalPath();
                }, 100);
            }
        }

        // Speed controls
        function increaseSpeed() {
            moveSpeed = Math.max(100, moveSpeed - 100);
            updateSpeedDisplay();

            // Restart interval if game is running
            if (gameRunning) {
                stopGame();
                startGame();
            }
        }

        function decreaseSpeed() {
            moveSpeed = Math.min(2000, moveSpeed + 100);
            updateSpeedDisplay();

            // Restart interval if game is running
            if (gameRunning) {
                stopGame();
                startGame();
            }
        }

        function updateSpeedDisplay() {
            document.getElementById('speed-display').textContent = (moveSpeed / 1000).toFixed(1) + 's';
        }

        // Initialize game on load
        initializeBoard();
    </script>
</body>
</html>
